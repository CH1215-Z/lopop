name: 당첨번호 자동 업데이트

on:
  schedule:
    # 시간은 UTC 기준입니다. 한국시간 = UTC + 9
    # GitHub 예약 실행은 몇 시간씩 늦거나 빠지는 일이 잦아서 여러 번 걸어 둡니다. (새 회차가 없으면 아무것도 안 바뀜)
    - cron: "37 12 * * 6"   # 토 21:37
    - cron: "13 13 * * 6"   # 토 22:13
    - cron: "47 13 * * 6"   # 토 22:47
    - cron: "23 14 * * 6"   # 토 23:23
    - cron: "17 16 * * 6"   # 일 01:17
    - cron: "43 22 * * 6"   # 일 07:43
    - cron: "7 1 * * 0"     # 일 10:07
    - cron: "33 5 * * 0"    # 일 14:33
  workflow_dispatch: {}     # Actions 탭에서 "Run workflow" 버튼으로 바로 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 새 회차 가져오기
        run: python scripts/update.py
      - name: 바뀐 내용이 있으면 저장
        run: |
          if git diff --quiet data.json; then
            echo "새 회차 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "당첨번호 업데이트: $(python -c 'import json;print(json.load(open("data.json"))[-1][0])')회"
            git push
          fi
